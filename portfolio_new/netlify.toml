[build]
  publish = "static"
  functions = "netlify/functions"

[build.environment]
  NODE_VERSION = "20"

[functions]
  node_bundler = "esbuild"

# Serve the admin page at /admin
[[redirects]]
  from = "/admin"
  to = "/admin.html"
  status = 200

# Keep the admin page out of search engines
[[headers]]
  for = "/admin*"
  [headers.values]
    X-Robots-Tag = "noindex, nofollow"
    Cache-Control = "no-store"
